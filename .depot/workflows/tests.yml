# Depot CI Migration
# Source: .github/workflows/tests.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: tests

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to a pull request replaces the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, sodium, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # Fails on a known vulnerability in anything installed. An abandoned
      # package is listed without failing: that's not a vulnerability.
      - run: composer audit --abandoned=report
      - run: vendor/bin/rector --dry-run
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpstan analyse -c phpstan.stubs.neon --no-progress
      - run: vendor/bin/pest --parallel

  # The oldest versions composer.json allows, so its floors stay true.
  lowest:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    name: tests (lowest dependencies)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, sodium, bcmath, intl
          coverage: none
      # Without the analyser, which needs a newer Laravel than Keyring does.
      - run: composer remove --dev calebdw/phpstan-laravel --no-update --no-interaction
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: vendor/bin/pest --parallel

  databases:
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix:
        include:
          - connection: pgsql
            port: 5432
          - connection: mysql
            port: 3306
    services:
      pgsql:
        image: postgres:18
        env:
          POSTGRES_DB: keyring
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keyring
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: keyring
      DB_USERNAME: ${{ matrix.connection == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: password
    name: tests (${{ matrix.connection }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_mysql, sodium, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pest --parallel
      - run: vendor/bin/pest --testsuite=Concurrency

  js:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bun from npm: setup-bun downloads from GitHub releases, which has been flaky.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g bun@1
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun test --randomize
